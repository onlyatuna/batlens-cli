[package]
name = "batlens-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Evan Chen <evanchen940628@gmail.com>"]
description = "Windows laptop battery monitor CLI"
license = "MIT"
readme = "README.md"

[[bin]]
name = "batlens"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
quick-xml = "0.37.5"
colored = "2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }
unicode-width = "0.2.3"

[build-dependencies]
winres = "0.1.12"
